[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearthd", "crates/hearth-cli", "crates/hearth-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
